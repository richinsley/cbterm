name: Build WebKit

on:
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit branch/tag/commit'
        required: false
        default: 'main'
  schedule:
    # Weekly build on Sundays at 2am UTC
    - cron: '0 2 * * 0'

env:
  WEBKIT_REF: ${{ github.event.inputs.webkit_ref || 'main' }}

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 240
    
    steps:
      - name: Checkout term repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja ccache
          
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: webkit-ccache-macos-arm64-${{ env.WEBKIT_REF }}-${{ github.run_number }}
          restore-keys: |
            webkit-ccache-macos-arm64-${{ env.WEBKIT_REF }}-
            webkit-ccache-macos-arm64-
            
      - name: Cache WebKit source
        uses: actions/cache@v4
        with:
          path: WebKit
          key: webkit-source-${{ env.WEBKIT_REF }}
          
      - name: Clone WebKit
        run: |
          if [ ! -d "WebKit" ]; then
            git clone --depth 1 --branch ${{ env.WEBKIT_REF }} https://github.com/WebKit/WebKit.git
          else
            cd WebKit
            git fetch --depth 1 origin ${{ env.WEBKIT_REF }}
            git checkout FETCH_HEAD
          fi
          
      - name: Apply patches
        run: |
          if [ -d "webkit/patches" ]; then
            cd WebKit
            for patch in ../webkit/patches/*.patch; do
              [ -f "$patch" ] && git apply "$patch" || true
            done
          fi

      - name: Configure WebKit (Minimal Build)
        run: |
          cd WebKit
          mkdir -p build
          cd build
          
          # Minimal build for embedding - disable features we don't need
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPORT=Mac \
            -DENABLE_MINIBROWSER=OFF \
            -DENABLE_WEBKIT=ON \
            -DENABLE_WEBCORE=ON \
            -DENABLE_JAVASCRIPTCORE=ON \
            -DENABLE_WEBGL=OFF \
            -DENABLE_WEBGPU=OFF \
            -DENABLE_WEB_RTC=OFF \
            -DENABLE_MEDIA_STREAM=OFF \
            -DENABLE_WEB_AUDIO=OFF \
            -DENABLE_VIDEO=OFF \
            -DENABLE_SPEECH_SYNTHESIS=OFF \
            -DENABLE_GAMEPAD=OFF \
            -DENABLE_GEOLOCATION=OFF \
            -DENABLE_NOTIFICATIONS=OFF \
            -DENABLE_ORIENTATION_EVENTS=OFF \
            -DENABLE_DEVICE_ORIENTATION=OFF \
            -DENABLE_POINTER_LOCK=OFF \
            -DENABLE_REMOTE_INSPECTOR=OFF \
            -DENABLE_DRAG_SUPPORT=ON \
            -DENABLE_SPELLCHECK=OFF \
            -DENABLE_FTPDIR=OFF \
            -DENABLE_NETSCAPE_PLUGIN_API=OFF \
            -DENABLE_PDF_PLUGIN=OFF \
            -DENABLE_APPLE_PAY=OFF \
            -DENABLE_PDFKIT_PLUGIN=OFF \
            -DUSE_SYSTEM_MALLOC=ON

      - name: Build WebKit
        run: |
          cd WebKit/build
          # Limit parallelism to avoid OOM
          ninja -j4 WebKit
          
      - name: Package WebKit Framework
        run: |
          cd WebKit/build
          mkdir -p dist
          
          # Copy the built framework
          if [ -d "Release/WebKit.framework" ]; then
            cp -R Release/WebKit.framework dist/
          elif [ -d "bin/WebKit.framework" ]; then
            cp -R bin/WebKit.framework dist/
          fi
          
          # Also need JavaScriptCore
          if [ -d "Release/JavaScriptCore.framework" ]; then
            cp -R Release/JavaScriptCore.framework dist/
          elif [ -d "bin/JavaScriptCore.framework" ]; then
            cp -R bin/JavaScriptCore.framework dist/
          fi
          
          # Create tarball
          cd dist
          tar -czvf webkit-macos-arm64.tar.gz *.framework
          
      - name: Get WebKit version
        id: webkit-version
        run: |
          cd WebKit
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webkit-macos-arm64-${{ steps.webkit-version.outputs.date }}
          path: WebKit/build/dist/webkit-macos-arm64.tar.gz
          retention-days: 90

      - name: Create Release (on schedule or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: webkit-${{ steps.webkit-version.outputs.date }}-${{ steps.webkit-version.outputs.sha }}
          name: WebKit Build ${{ steps.webkit-version.outputs.date }}
          body: |
            Automated WebKit build from source.
            
            - WebKit commit: ${{ steps.webkit-version.outputs.sha }}
            - Build date: ${{ steps.webkit-version.outputs.date }}
            - Platform: macOS ARM64
            
            This is a minimal build with disabled features:
            - No WebGL/WebGPU
            - No WebRTC
            - No Web Audio/Video
            - No Speech/Geolocation/Gamepad
          files: |
            WebKit/build/dist/webkit-macos-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Future: Intel macOS build
  # build-macos-x64:
  #   runs-on: macos-13
  #   ...

  # Future: Linux build (WebKitGTK)
  # build-linux:
  #   runs-on: ubuntu-latest
  #   ...
