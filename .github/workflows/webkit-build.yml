name: Build WebKit

on:
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit branch/tag/commit'
        required: false
        default: 'main'
  schedule:
    # Weekly build on Sundays at 2am UTC
    - cron: '0 2 * * 0'

env:
  WEBKIT_REF: ${{ github.event.inputs.webkit_ref || 'main' }}

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 360
    
    steps:
      - name: Checkout term repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Remove unnecessary tools to free disk space
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android
          df -h
          
      - name: Install dependencies
        run: |
          brew install ccache
          # WebKit's build-webkit script handles other deps
          
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: webkit-ccache-macos-arm64-${{ env.WEBKIT_REF }}-${{ github.run_number }}
          restore-keys: |
            webkit-ccache-macos-arm64-${{ env.WEBKIT_REF }}-
            webkit-ccache-macos-arm64-
            
      - name: Cache WebKit source
        uses: actions/cache@v4
        with:
          path: WebKit
          key: webkit-source-${{ env.WEBKIT_REF }}
          
      - name: Clone WebKit
        run: |
          if [ ! -d "WebKit" ]; then
            echo "Cloning WebKit..."
            git clone --depth 1 --branch ${{ env.WEBKIT_REF }} https://github.com/WebKit/WebKit.git
          else
            echo "Updating existing WebKit checkout..."
            cd WebKit
            git fetch --depth 1 origin ${{ env.WEBKIT_REF }}
            git checkout FETCH_HEAD
          fi
          
      - name: Apply patches
        run: |
          if [ -d "webkit/patches" ] && [ "$(ls -A webkit/patches/*.patch 2>/dev/null)" ]; then
            cd WebKit
            for patch in ../webkit/patches/*.patch; do
              echo "Applying $patch..."
              git apply "$patch" || echo "Patch $patch failed, continuing..."
            done
          fi

      - name: Build WebKit (Official Script)
        run: |
          cd WebKit
          
          # Configure ccache
          export PATH="/usr/local/opt/ccache/libexec:$PATH"
          export CCACHE_DIR=~/Library/Caches/ccache
          export CCACHE_MAXSIZE=10G
          ccache --zero-stats
          
          # Use official build-webkit script
          # --release: Release build
          # --architecture=arm64: Target architecture  
          # The script handles all cmake configuration properly
          Tools/Scripts/build-webkit \
            --release \
            --architecture=arm64 \
            --no-experimental-features \
            2>&1 | tee build.log
          
          # Show ccache stats
          ccache --show-stats
          
      - name: Package WebKit Framework
        run: |
          cd WebKit
          mkdir -p dist
          
          # Find and copy the built frameworks
          # build-webkit puts output in WebKitBuild/Release
          BUILD_DIR="WebKitBuild/Release"
          
          if [ -d "$BUILD_DIR" ]; then
            echo "Contents of $BUILD_DIR:"
            ls -la "$BUILD_DIR"
            
            # Copy frameworks
            for framework in WebKit JavaScriptCore WebCore; do
              if [ -d "$BUILD_DIR/$framework.framework" ]; then
                echo "Copying $framework.framework..."
                cp -R "$BUILD_DIR/$framework.framework" dist/
              fi
            done
          else
            echo "Build directory not found at $BUILD_DIR"
            find WebKitBuild -name "*.framework" -type d 2>/dev/null | head -20
            exit 1
          fi
          
          # Create tarball
          cd dist
          if [ "$(ls -A *.framework 2>/dev/null)" ]; then
            tar -czvf webkit-macos-arm64.tar.gz *.framework
            echo "Created webkit-macos-arm64.tar.gz"
            ls -lh webkit-macos-arm64.tar.gz
          else
            echo "No frameworks found to package!"
            exit 1
          fi
          
      - name: Get WebKit version
        id: webkit-version
        run: |
          cd WebKit
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webkit-macos-arm64-${{ steps.webkit-version.outputs.date }}
          path: WebKit/dist/webkit-macos-arm64.tar.gz
          retention-days: 90

      - name: Create Release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: webkit-${{ steps.webkit-version.outputs.date }}-${{ steps.webkit-version.outputs.sha }}
          name: WebKit Build ${{ steps.webkit-version.outputs.date }}
          body: |
            Automated WebKit build from source using official build-webkit script.
            
            - WebKit commit: ${{ steps.webkit-version.outputs.sha }}
            - Build date: ${{ steps.webkit-version.outputs.date }}
            - Platform: macOS ARM64 (Apple Silicon)
            - Build type: Release
            
            Built with `--no-experimental-features` for stability.
          files: |
            WebKit/dist/webkit-macos-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Future: Intel macOS build
  # build-macos-x64:
  #   runs-on: macos-13
  #   ...

  # Future: Linux build (WebKitGTK)
  # build-linux:
  #   runs-on: ubuntu-latest
  #   ...
